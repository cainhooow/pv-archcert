[package]
name = "archcert-crypto"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[features]
local-development = ["dep:getrandom", "dep:rustix", "dep:zeroize", "ed25519-dalek/pkcs8", "ed25519-dalek/alloc"]

[dependencies]
ed25519-dalek = "=3.0.0"
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
getrandom = { version = "0.4", optional = true }
rustix = { workspace = true, optional = true }
zeroize = { version = "1.8", optional = true, features = ["alloc"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
