name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: STATIC / DEFAULT GATES
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_DB: archcert
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d archcert"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install real Git push fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server git python3
          sudo mkdir -p /run/sshd
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: ./scripts/check-architecture
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Real PostgreSQL concurrency and recovery tests
        run: ./scripts/test-ravenport
        env:
          ARCHCERT_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/archcert
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

# LIVE OCI GATES — NOT RUN IN STANDARD CI.
# See docs/runner/LINUX_QUALIFICATION.md for the future dedicated runner workflow.
# Ignored live tests need an independently provisioned rootless daemon/pinned image.
