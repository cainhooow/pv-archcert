name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: STATIC / DEFAULT GATES
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Install real Git push fixture prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server git python3
          sudo mkdir -p /run/sshd
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: ./scripts/check-architecture
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo deny check

# LIVE OCI GATES — NOT RUN IN STANDARD CI.
# See docs/runner/LINUX_QUALIFICATION.md for the future dedicated runner workflow.
# Ignored live tests need an independently provisioned rootless daemon/pinned image.
