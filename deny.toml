[advisories]
yanked = "deny"

[licenses]
# Minimal set satisfying the locked dependencies, including AND expressions.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]

[licenses.private]
# Workspace crates already declare publish=false. This does not assign a license
# to ArchCert or exempt any third-party dependency from license checking.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Reviewed in docs/architecture/NORTHGATE_DEPENDENCY_REVIEW.md. Narrow exception
# for gitoxide's pinned decompressor; other new licenses still fail closed.
[[licenses.exceptions]]
name = "zlib-rs"
version = "=0.6.8"
allow = ["Zlib"]

# Build-only prost-build -> petgraph -> hashbrown dependency, reviewed in
# docs/architecture/PROTOBUF_DEPENDENCY_REVIEW.md. Keep the exception exact.
[[licenses.exceptions]]
name = "foldhash"
version = "=0.1.5"
allow = ["Zlib"]
