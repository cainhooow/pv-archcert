[package]
name = "archcertd"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
archcert-domain = { path = "../../crates/archcert-domain", version = "=0.1.0" }
archcert-control-plane = { path = "../../crates/archcert-control-plane", version = "=0.1.0" }
clap.workspace = true
anyhow.workspace = true
archcert-application = { path = "../../crates/archcert-application", version = "=0.1.0" }
archcert-protocol = { path = "../../crates/archcert-protocol", version = "=0.1.0" }
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
